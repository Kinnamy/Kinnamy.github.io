<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox 3-Column Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header class="box header">Header</header>
        
        <div class="main-section">
            <div class="box sidebar-a">Sidebar A</div>
            <div class="box main-content">Main content</div>
            <div class="box sidebar-b">Sidebar B</div>
        </div>
        
        <footer class="box footer">Footer</footer>
    </div>

</body>
</html>
